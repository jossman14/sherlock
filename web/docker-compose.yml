# Dua layanan: API Python yang membungkus Sherlock, dan UI Next.js yang mem-proxy
# /api ke sana. Hanya UI yang dipublikasikan ke luar; API tinggal di jaringan internal.
services:
  # Nama layanan HARUS unik lintas seluruh VPS, bukan cuma di dalam proyek ini:
  # `ui` ikut jaringan overlay dokploy-network yang dipakai bersama semua aplikasi,
  # dan di sana nama sependek "api" sudah dipakai stack lain — permintaan /api kami
  # sempat mendarat di API milik aplikasi tetangga.
  sherlock-api:
    build:
      context: ..
      dockerfile: web/api/Dockerfile
    restart: unless-stopped
    environment:
      SHERLOCK_RATE_MAX: "${SHERLOCK_RATE_MAX:-5}"
      SHERLOCK_RATE_WINDOW: "${SHERLOCK_RATE_WINDOW:-600}"
      SHERLOCK_MAX_CONCURRENT: "${SHERLOCK_MAX_CONCURRENT:-4}"
      SHERLOCK_MAX_CONCURRENT_IP: "${SHERLOCK_MAX_CONCURRENT_IP:-1}"
      SHERLOCK_TIMEOUT: "${SHERLOCK_TIMEOUT:-30}"
    expose:
      - "8000"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        SHERLOCK_API_URL: http://sherlock-api:8000
    restart: unless-stopped
    depends_on:
      - sherlock-api
    ports:
      - "127.0.0.1:${SHERLOCK_PORT:-8090}:3000"
    networks:
      - default
      - dokploy-network
    # Traefik milik Dokploy yang menerbitkan ke publik. Entrypoint `web` saja karena
    # TLS diterminasi Cloudflare di depan — pola yang sama dipakai aplikasi lain di VPS ini.
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.sherlock-web.rule: Host(`${SHERLOCK_HOST:-sherlock.nusawangsa.com}`)
      traefik.http.routers.sherlock-web.entrypoints: web
      traefik.http.routers.sherlock-web.service: sherlock-web
      traefik.http.services.sherlock-web.loadbalancer.server.port: "3000"

networks:
  dokploy-network:
    external: true
